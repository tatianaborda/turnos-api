spring.application.name=turnos-api
server.port=8080

# Pais para consultar feriados (codigo ISO de 2 letras: AR, BR, MX, CO, CL...)
turnos.pais=AR

# --- Cliente HTTP declarativo: grupo "feriados" (API publica Nager.Date) ---
spring.http.serviceclient.feriados.base-url=https://date.nager.at
spring.http.serviceclient.feriados.connect-timeout=2s
spring.http.serviceclient.feriados.read-timeout=3s

# --- Errores con ProblemDetail (RFC 9457) ---
spring.mvc.problemdetails.enabled=true

# --- Versionado nativo de APIs (Spring Framework 7) ---
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Base de datos: H2 guardada en un archivo (carpeta ./data) ---
spring.datasource.url=jdbc:h2:file:./data/turnos
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Con una base en archivo, Spring ya no corre schema.sql/data.sql solo.
# "always" le dice que los ejecute en cada arranque (por eso estan escritos para no duplicar datos).
spring.sql.init.mode=always

# --- Pool de conexiones HikariCP ---
spring.datasource.hikari.pool-name=TurnosPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
# Muestra en el log cuantas conexiones estan en uso, libres o en espera
logging.level.com.zaxxer.hikari=DEBUG

# --- Virtual Threads: cada request en un hilo virtual ---
spring.threads.virtual.enabled=true

# --- NUEVO: Spring Data JPA / Hibernate ---
# Mostrar en el log el SQL que genera Hibernate (solo para aprender: en produccion se apaga)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# La tabla la crea schema.sql: Hibernate no toca la estructura de la base
spring.jpa.hibernate.ddl-auto=none
# Cerrar la conexion con la base al terminar el servicio, no al terminar la respuesta HTTP
spring.jpa.open-in-view=false

# --- NUEVO: paginacion ---
# Aunque el cliente pida size=10000, nunca se devuelven mas de 100 por pagina
spring.data.web.pageable.max-page-size=100
