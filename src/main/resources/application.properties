spring.application.name=turnos-api
server.port=8080

# Pais para consultar feriados (codigo ISO de 2 letras: AR, BR, MX, CO, CL...)
turnos.pais=AR

# --- Cliente HTTP declarativo: grupo "feriados" (API publica Nager.Date) ---
spring.http.serviceclient.feriados.base-url=https://date.nager.at
spring.http.serviceclient.feriados.connect-timeout=2s
spring.http.serviceclient.feriados.read-timeout=3s

# --- Errores con ProblemDetail (RFC 9457) ---
spring.mvc.problemdetails.enabled=true

# --- Versionado nativo de APIs (Spring Framework 7) ---
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0

# --- NUEVO (LC2): OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- NUEVO (LC3): H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:turnos
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# schema.sql y data.sql se ejecutan solos en bases embebidas

# --- NUEVO (panorama): Virtual Threads, cada request en un hilo virtual ---
spring.threads.virtual.enabled=true
