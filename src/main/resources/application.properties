spring.application.name=turnos-api
server.port=8080

# Mostrar los mappings registrados al arrancar
logging.level.org.springframework.web=DEBUG

# --- LC1: pais para consultar feriados (AR, BR, MX, CO, CL...) ---
turnos.pais=AR

# --- LC1: cliente HTTP declarativo, grupo "feriados" (API publica Nager.Date) ---
spring.http.serviceclient.feriados.base-url=https://date.nager.at
spring.http.serviceclient.feriados.connect-timeout=2s
spring.http.serviceclient.feriados.read-timeout=3s

# --- LC2: errores con ProblemDetail (RFC 9457) ---
spring.mvc.problemdetails.enabled=true

# --- LC3: versionado nativo de APIs (Spring Framework 7) ---
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0
